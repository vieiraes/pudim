<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pudim mark v2 — flat, geometrico, minimalista. Sem gradientes pesados, sem texto serifado. -->

  <!-- Fundo: cartao arredondado (superelipse "moderna") -->
  <rect width="512" height="512" rx="140" fill="#2A1200"/>

  <!-- Prato: duas elipses solidas (leve indicacao de volume sem gradiente) -->
  <ellipse cx="256" cy="382" rx="150" ry="24" fill="#D9C7A0"/>
  <ellipse cx="256" cy="378" rx="150" ry="12" fill="#F2E8D2"/>

  <!-- Corpo do pudim: trapezio arredondado, cor solida -->
  <path d="
    M 160 362
    Q 152 362 152 352
    L 152 236
    Q 152 152 256 152
    Q 360 152 360 236
    L 360 352
    Q 360 362 352 362
    Z
  " fill="#F0B84E"/>

  <!-- Face lateral direita em tom mais escuro: sugere volume com forma solida, sem gradiente.
       Comeca em y=200 (dentro da elipse do topo) para nunca ultrapassar seu contorno. -->
  <path d="
    M 312 200
    Q 356 206 360 236
    L 360 352
    Q 360 362 352 362
    L 312 362
    Z
  " fill="#DE9C2E" opacity="0.9"/>

  <!-- Topo do pudim: calda de caramelo, elipse solida -->
  <ellipse cx="256" cy="196" rx="104" ry="42" fill="#9A4A0E"/>

  <!-- Buraco central do topo: marca caracteristica do pudim -->
  <ellipse cx="256" cy="192" rx="26" ry="9" fill="#6B2E06"/>

  <!-- Uma unica calda escorrendo, presa abaixo da borda do topo -->
  <path d="M 294 232 Q 286 262 290 298 Q 298 302 304 296 Q 300 260 304 230 Z" fill="#9A4A0E"/>

  <!-- Brilho: forma geometrica simples (retangulo arredondado), nao radial -->
  <rect x="192" y="188" width="34" height="70" rx="17" fill="#FFF3D6" opacity="0.35"/>
</svg>
